<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>C-Flex FMS — 로그인</title>
  <link rel="stylesheet" href="/static/console.css">
</head>
<body class="center">
  <main class="card narrow">
    <h1>C-Flex FMS</h1>
    <p class="muted">Local Console · <span id="tenant">HAEA</span></p>

    <form id="login" autocomplete="on">
      <label>사용자 / Username <input name="username" autocomplete="username" required autofocus></label>
      <label>비밀번호 / Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">로그인 / Sign in</button>
    </form>

    <form id="change" hidden>
      <p>처음 로그인입니다. 비밀번호를 바꿔 주세요. / Set a new password to continue.</p>
      <p class="muted small">12자 이상, 대문자·소문자·숫자·기호 중 3종 이상, 사용자명 포함 불가.</p>
      <label>현재 비밀번호 / Current <input name="current" type="password" autocomplete="current-password" required></label>
      <label>새 비밀번호 / New <input name="next" type="password" autocomplete="new-password" required minlength="12"></label>
      <label>새 비밀번호 확인 / Confirm <input name="confirm" type="password" autocomplete="new-password" required minlength="12"></label>
      <button type="submit">변경 / Change</button>
    </form>

    <p id="msg" class="error" role="alert"></p>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
