# nginx main config for cflex/web. Read-only root filesystem: everything nginx writes is in /tmp.
worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # No request bodies, no cookies, no query strings (they can carry tokens).
    log_format cflex '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout cflex;

    # Per-node server block rendered by cflex-install (install/templates/nginx/cflex-console.conf).
    include /opt/cflex/nginx.d/*.conf;
}
