# onboard-credentials.yaml — cflex-onboard log-ins and SNMPv3 keys (spec 04 §2).
# STRUCTURE ONLY: no value here is real. Copy, fill on the run host, chmod 600.
#   collector VM: /opt/app/cflex/config/onboard-credentials.yaml (owner cflex, 0600)
#   laptop:       anywhere outside a git checkout, 0600
# cflex-onboard refuses the file unless it is 0600. Never commit a filled copy.
#
# A value is either written here or `ref:NAME` = read from environment variable
# NAME at run time (or asked for with --ask). Values never appear in logs,
# reports, the audit log or error messages.

# Log-in used for every card unless overridden below.
defaults: { user: <nmc-user>, password: ref:ONBOARD_DEFAULT_PW, transport: ssh }

# Per-card exceptions, keyed by the inventory IP. Only what differs.
# transport: https = read-only fallback (config.ini over the web UI).
overrides:
  192.0.2.34: { user: <nmc-user>, password: ref:ONBOARD_CARD34_PW }
  192.0.2.25: { transport: https }

# SNMPv3 pass phrases for the user apply creates (15–32 chars, no space/quote).
# The user name and protocols are in site.yaml `onboard:`; the keys are only here.
snmpv3: { auth_key: ref:ONBOARD_V3_AUTH, priv_key: ref:ONBOARD_V3_PRIV }

# Optional: different keys for one site.
# sites:
#   HMA-FV: { snmpv3: { auth_key: ref:HMA_V3_AUTH, priv_key: ref:HMA_V3_PRIV } }

# Optional: Local Console operator log-in (inventory + maintenance window).
# console: { user: <console-operator>, password: ref:ONBOARD_CONSOLE_PW }

# Optional: option 2 scan — community for one SNMP GET of sysObjectID.
# scan: { community: ref:ONBOARD_SCAN_COMMUNITY }
