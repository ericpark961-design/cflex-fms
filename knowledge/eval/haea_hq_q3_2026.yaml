# 골든 Q&A — 명세 03 §8. 출처: RingOn Q3-2026 PM 보고서 5건(HAEA HQ) + 부록 C. 정답은 '근거에 반드시 포함돼야 하는 사실'로 적는다(문장 일치가 아니라 사실 포함 채점).
schema_version: 1
cases:
  - id: E-001
    mode: noc
    question: "HAEA HQ IDF 537 UPS 지금 상태 알려줘"
    must_include: ["SRT5KRMXLT", "AS2528280276", "부하 19%", "런타임 33:17 또는 39m33s", "마지막 PM 2026-10-02 PASS", "REPLACE ALL RBC 알람 문구"]
    must_cite: ["sitebook:HAEA-HQ-IDF-537"]
    must_not_include: ["snmp community 값", "타 테넌트"]
  - id: E-002
    mode: noc
    question: "IDF 537 배터리가 94%이고 자가진단도 GOOD인데 REPLACE ALL RBC 알람이 뜬 이유와 조치는?"
    must_include: ["RB-UPS-RBC-REPLACE-ALARM-001", "Self-test 재실행", "캘리브레이션은 고객 승인 전 금지", "보증(설치 2025-07)"]
    must_cite: ["runbook:RB-UPS-RBC-REPLACE-ALARM-001", "grade A 1건 이상"]
  - id: E-003
    mode: noc
    question: "HQ UPS 4대의 시계가 50~55분 늦다. 공통 원인과 조치는?"
    must_include: ["NTP", "IDF 332", "IDF 433", "IDF 537", "MDF 2F", "사람이 NMC에서 설정(장비 쓰기 금지)", "CLOCK_DRIFT"]
    must_cite: ["runbook:RB-UPS-CLOCK-DRIFT-001"]
  - id: E-004
    mode: noc
    question: "MDF 1F UPS A 배터리 모듈이 14개인데 11개만 등록됐다. 런타임 2시간은 믿어도 되나?"
    must_include: ["신뢰하지 않는다 또는 확인 전까지 보류", "XBP 통신 케이블", "납품 수량 대조", "RB-ULTRA-XBP-MODULE-COUNT-001"]
    must_cite: ["sitebook:HAEA-HQ-MDF-1F-UPS-A"]
  - id: E-005
    mode: noc
    question: "MDF 1F UPS A 에 환경 고점 이력이 9/26 00:54에 있다. 무슨 뜻이고 뭘 확인해야 하나?"
    must_include: ["심야", "공조", "활성 알람 없음", "데이터 로그 추세", "collect_diag"]
    must_cite: ["runbook:RB-NMC-ENV-HISTORY-001"]
