# K1 수집 허용목록 — 명세 03 §2.2. 이 목록 밖은 수집하지 않는다. URL/문서 ID는 Codex WO-PTL-008에서 실제 조회로 확정(TBD는 확정 전 수집 금지).
schema_version: 1
policy:
  allowed_domains: [www.se.com, se.com, www.apc.com, apc.com, download.schneider-electric.com, community.se.com]
  disallowed: ["login/partner-only pages", "paywalled", "any domain not listed"]
