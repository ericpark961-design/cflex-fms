# C-Flex Local Console — nginx (TLS 443) in front of cflex-app, bare profile, app01's copy.
# Reference only: cflex-install renders the real one per node into /etc/nginx/conf.d/
# from install/templates/nginx/cflex-console.conf —
#   cflex-install render --role app --host-id app01 --profile bare --config site.yaml --out DIR
# This file is that output for the example site (app01 10.138.14.67, peer app02 10.138.14.68).
#
#   users (HAEA VLAN/VPN) ──443──► nginx on app01 ──► cflex-app 127.0.0.1:8080
#   collector cap01      ──443──► same, /collector/v1/* (key-authenticated by the app)
#                                    └─ local app down (502/504) ──443──► nginx on app02 ──► its app
#
# Between the app nodes only 443 (and Redis 6379), as firewall request v3 FW-7 lists them —
# no 8080 (DECISIONS Q-2026-10-25-10). firewalld: https to the user sources (FW-5) and the
# peer /32; 6379 from the peer /32 only (cflex-install does both).
# SELinux: nginx → 127.0.0.1:8080 and → peer 443 needs  setsebool -P httpd_can_network_connect 1
# (cflex-install does this; never setenforce 0).
# Certificates: HAEA internal CA (spec §4); console-ca.pem verifies the peer's.

upstream cflex_app_local {
    server 127.0.0.1:8080 max_fails=0;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /opt/app/cflex/certs/console.crt;
    ssl_certificate_key /opt/app/cflex/certs/console.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cflex:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The import endpoint takes a CSV; the app caps bodies at 5 MB.
    client_max_body_size 6m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 3s;

    set_real_ip_from 10.138.14.68;
    real_ip_header X-Forwarded-For;

    # Container HEALTHCHECK: nginx itself, not the app behind it.
    location = /-/nginx {
        access_log off;
        return 204;
    }

    location / {
        proxy_pass http://cflex_app_local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # replaced, not appended: the app trusts only nginx
        proxy_set_header X-Forwarded-Proto https;
        # Local app down → the peer node, over 443.
        error_page 502 504 = @peer;
    }

    location @peer {
        # One hop only: a request the peer already forwarded is not sent back.
        if ($http_x_cflex_peer) { return 502; }
        proxy_pass https://10.138.14.68:443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-CFlex-Peer 1;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /opt/app/cflex/certs/console-ca.pem;
        proxy_ssl_name 10.138.14.68;
    }
}
