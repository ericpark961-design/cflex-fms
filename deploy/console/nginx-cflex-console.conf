# C-Flex Local Console — nginx (TLS 443) in front of cflex-app on app01/app02.
# Spec 01 §1 network table, §2.2. Same file on both app nodes.
#
#   users (HAEA VLAN/VPN) ──443──► nginx on app01 (active) ──► app01:8080, app02:8080 (backup)
#   collector cap01      ──443──► same, /collector/v1/* (key-authenticated by the app)
#
# cflex-app listens on 0.0.0.0:8080 (not 127.0.0.1) so either node's nginx can
# reach either app. firewalld opens 8080 only between app01 and app02:
#   firewall-cmd --permanent --zone=internal --add-source=10.138.14.67/32 --add-source=10.138.14.68/32
#   firewall-cmd --permanent --zone=internal --add-port=8080/tcp
#   firewall-cmd --permanent --zone=public  --add-service=https
# SELinux: nginx connecting to 8080 needs  setsebool -P httpd_can_network_connect 1
# (cflex-install does this; never setenforce 0).
#
# Certificates: HAEA internal CA (spec §4 — replacement procedure in docs). Paths
# are the installer's defaults.

upstream cflex_app {
    server 10.138.14.67:8080 max_fails=2 fail_timeout=10s;   # app01 (active)
    server 10.138.14.68:8080 backup;                          # app02 (standby)
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /opt/app/cflex/certs/console.crt;
    ssl_certificate_key /opt/app/cflex/certs/console.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cflex:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The import endpoint takes a CSV; the app caps bodies at 5 MB.
    client_max_body_size 6m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout http_502 http_503;

    # Logs to journald via stderr in the container profile; no request bodies, no cookies.
    access_log /var/log/nginx/cflex-console.access.log;

    location / {
        proxy_pass http://cflex_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # replaced, not appended: the app trusts only nginx
        proxy_set_header X-Forwarded-Proto https;
    }

    # Health for keepalived / monitoring: 503 when Redis is unreachable.
    location = /healthz {
        proxy_pass http://cflex_app;
        access_log off;
    }
}
