# C-Flex Redis 6 — console sessions and login-failure counters. Rendered by cflex-install @@INSTALLER_VERSION@@.
# Inside the console network namespace; published on the host only on the Redis node (FW-7, peer app 6379).
bind 0.0.0.0
port 6379
protected-mode yes
# requirepass lives in a 0600 file so it is never in this file, argv or a log.
include /opt/app/cflex/secrets/auth.conf
dir /var/lib/redis/data
appendonly no
save 900 1
logfile ""
