# C-Flex Redis 6 — console sessions and login-failure counters. Rendered by cflex-install @@INSTALLER_VERSION@@.
# Inside the console network namespace; published on the host for the peer app node only (FW-7, app01↔app02 6379).
bind 0.0.0.0
port 6379
protected-mode yes
# requirepass and masterauth live in a 0600 file so they are never in this file, argv or a log.
include /opt/app/cflex/secrets/auth.conf
dir /var/lib/redis/data
appendonly no
save 900 1
logfile ""

@@REDIS_REPLICATION@@
