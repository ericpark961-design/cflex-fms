# C-Flex Local Console — nginx server for @@NODE_ID@@ (@@HOST_IP@@). Rendered by cflex-install @@INSTALLER_VERSION@@.
# Container profile: nginx, cflex-app and Redis share one network namespace (bare profile: one
# host), so the app is 127.0.0.1:8080 and nothing but 443 crosses the host firewall (request v3 FW-5, FW-7).
# Listens on @@LISTEN_PORT@@ (container: 8443, reached as host 443 — docs/install/CONTAINER_PROFILE.md §2).
#
#   user ──443──► this nginx ──► local app 127.0.0.1:8080
#                      └─ local app down (502/504) ──443──► peer nginx (@@PEER_ID@@ @@PEER_IP@@) ──► peer app
#
# The peer hop stays on 443 (FW-7 "app01↔app02 6379/443"); the bare-profile config in
# deploy/console/ uses 8080 between nodes instead, which v3 does not list (Q-2026-10-25-10).

upstream cflex_app_local {
    server 127.0.0.1:8080 max_fails=0;
    keepalive 16;
}

server {
    listen @@LISTEN_PORT@@ ssl http2;
    server_name _;

    ssl_certificate     /opt/app/cflex/certs/console.crt;
    ssl_certificate_key /opt/app/cflex/certs/console.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cflex:10m;
    ssl_session_timeout 1h;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The import endpoint takes a CSV; the app caps bodies at 5 MB.
    client_max_body_size 6m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 3s;

@@REALIP@@

    # Container HEALTHCHECK: nginx itself, not the app behind it.
    location = /-/nginx {
        access_log off;
        return 204;
    }

    location / {
        proxy_pass http://cflex_app_local;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # replaced, not appended: the app trusts only nginx
        proxy_set_header X-Forwarded-Proto https;
@@PEER_FALLBACK@@
    }

@@PEER_LOCATION@@
}
