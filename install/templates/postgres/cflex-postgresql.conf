# C-Flex PostgreSQL 16 settings (db01, spec 01 §2.3) — rendered by cflex-install @@INSTALLER_VERSION@@.
# Container profile: mounted into rhel8/postgresql-16 as /opt/app-root/src/postgresql-cfg/ (the image
# includes every *.conf there at the end of postgresql.conf). Bare profile: included from
# /opt/data/pgsql/data/postgresql.conf — docs/install/PG_BACKUP_RESTORE.md §1.
# Changing wal_level or archive_mode needs a restart of the server.

# A standby can be added later by streaming replication (spec: "추후 스탠바이"); repmgr is not used.
wal_level = replica
max_wal_senders = 10

# Every finished WAL segment is copied next to the base backups (cflex-pg-backup.sh keeps 14 days).
# The copy refuses to overwrite: a segment already archived is never replaced by another.
archive_mode = on
archive_command = 'test ! -f @@WAL_DIR@@/%f && cp %p @@WAL_DIR@@/%f'
# A segment is archived at the latest after this long, so a restore loses at most this much.
archive_timeout = 900
